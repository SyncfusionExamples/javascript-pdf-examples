<div style="
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#f8fafc,#eaf3ff);
    font-family:'Segoe UI',sans-serif;
">
  <div style="
      background:#fff;
      padding:24px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      text-align:center;
      width:400px;
    ">
    <h2 style="
        color:#0f6cbd;
        margin:0 0 16px 0;
    ">
      PDF Text Search
    </h2>
    <div style="
        display:flex;
        flex-direction:column;
        gap:10px;
    ">
    <button (click)="findText()" style="
          background:#0f6cbd;
          color:#fff;
          border:none;
          padding:10px 16px;
          border-radius:8px;
          font-size:16px;
          font-weight:600;
          cursor:pointer;
        ">
        Find Text
      </button>
      <button (click)="findMultipleText()" style="
          background:#0f6cbd;
          color:#fff;
          border:none;
          padding:10px 16px;
          border-radius:8px;
          font-size:16px;
          font-weight:600;
          cursor:pointer;
        ">
        Find Multiple Text
      </button>
    </div>
  </div>
</div>
