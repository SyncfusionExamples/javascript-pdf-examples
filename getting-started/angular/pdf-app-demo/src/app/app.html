<div style="
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f4f7fc;
  ">
  <div style="
      width: 600px;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      text-align: center;
    ">
    <h2 style="
        color: #0f6cbd;
        margin-bottom: 20px;
      ">
      JavaScript PDF Library
    </h2>

    <p style="
        font-size: 16px;
        line-height: 1.6;
        color: #444;
        margin-bottom: 20px;
      ">
      Click the button below to generate a PDF document using the
      Syncfusion JavaScript PDF Library.
    </p>

    <button (click)="createPdf()" style="
        background: #0f6cbd;
        color: #ffffff;
        border: none;
        padding: 12px 28px;
        font-size: 18px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
      ">
      Generate PDF
    </button>

    <p style="
        font-size: 15px;
        line-height: 1.6;
        color: #666;
        margin-bottom: 30px;
      ">
      Note: Adobe Reader or an equivalent PDF viewer is required to open the
      generated document.
    </p>
  </div>
</div>
