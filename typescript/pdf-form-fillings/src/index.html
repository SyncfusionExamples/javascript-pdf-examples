<!DOCTYPE html>
<html lang="en">

<head>
    <title>PDF Forms</title>
    <!-- Syncfusion components styles (CDN) -->
    <link rel="stylesheet" href="https://cdn.syncfusion.com/ej2/33.2.12/material.css">
</head>

<div class="container py-4">
    <h1 class="h4 mb-3">PDF Forms</h1>
</div>

<div class="control-section" style="margin-top: 3%;">
    <div class="form-group">
        <label for="name">Name</label>
        <input id="name" class="e-input" type="text" placeholder="John Milton" value="John Milton" />
    </div>
    <div class="form-group">
        <label for="gender">Gender</label>
        <input id="gender" type="text" />
    </div>
    <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input id="dob" type="text" />
    </div>
    <div class="form-group">
        <label for="email">Email ID</label>
        <input id="email" class="e-input" type="text" placeholder="john.milton@example.com"
            value="john.milton@example.com" />
    </div>
    <div class="form-group">
        <label for="state">Coming from</label>
        <input id="state" type="text" />
    </div>
    <!-- Newsletter -->
    <div class="form-group">
        <div class="inline">
            <input id="newsletter" type="checkbox" />
            <label for="newsletter" style="font-weight: 600;"></label>
        </div>
    </div>
    <button id="formBtn" class="btn btn-primary" style="margin: 1%;">Generate PDF</button>
</div>

<style>
    :root {
        --bg: #f7f7f7;
        --border: #d6d6d6;
        --text: #333;
        --primary: #4a90e2;
        --btn-bg: #e9ecef;
    }
    .control-section {
        border: 2px solid black;
        padding: 10px;
    }
    .form-group {
        margin-bottom: 12px;
    }
    label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
    }
    .e-input,
    .e-dropdownlist,
    .e-datepicker {
        width: 100%;
        height: 30px;
    }
    .e-datepicker{
        height: auto;
    }
    .e-input-group {
        width: 100%;
    }
    input.e-input {
        width: 100%;
        box-sizing: border-box;
    }
    .inline {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
    }
    .btn-row {
        display: flex;
        gap: 12px;
        margin-top: 14px;
        flex-wrap: wrap;
    }
    .btn {
        background: var(--btn-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 14px;
        font-weight: 600;
        cursor: pointer;
    }
    .btn.primary {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
    }
</style>

</html>
