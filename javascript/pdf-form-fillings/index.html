<head>
    <!-- Syncfusion JavaScript PDF Library (CDN) -->
    <script src="https://cdn.syncfusion.com/ej2/33.2.12/dist/ej2.min.js"></script>
    <!-- Syncfusion components styles (CDN) -->
    <link rel="stylesheet" href="https://cdn.syncfusion.com/ej2/33.2.12/material.css">
</head>

<div class="container py-4">
    <h1 class="h4 mb-3">PDF Forms</h1>
</div>

<div class="control-section" style="margin-top: 3%;">
    <div class="form-group">
        <label for="name">Name</label>
        <input id="name" class="e-input" type="text" placeholder="John Milton" value="John Milton" />
    </div>
    <div class="form-group">
        <label for="gender">Gender</label>
        <input id="gender" type="text" />
    </div>
    <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input id="dob" type="text" />
    </div>
    <div class="form-group">
        <label for="email">Email ID</label>
        <input id="email" class="e-input" type="text" placeholder="john.milton@example.com"
            value="john.milton@example.com" />
    </div>
    <div class="form-group">
        <label for="state">Coming from</label>
        <input id="state" type="text" />
    </div>
    <!-- Newsletter -->
    <div class="form-group">
        <div class="inline">
            <input id="newsletter" type="checkbox" />
            <label for="newsletter" style="font-weight: 600;"></label>
        </div>
    </div>
    <button id="formBtn" class="btn btn-primary" style="margin: 1%;">Generate PDF</button>
</div>

<script>
    // Create and initialize the PDF creation button
    var formBtn = new ej.buttons.Button();
    formBtn.appendTo('#formBtn');
    // Generate an PDF Form when the button is clicked
    formBtn.element.onclick = createFormPDF;
    // Gender DropDownList
    var genderData = [
        { text: 'Male', value: 'Male' },
        { text: 'Female', value: 'Female' },
        { text: 'Other', value: 'Other' }
    ];
    var genderDropDown = new ej.dropdowns.DropDownList({
        dataSource: genderData,
        fields: { text: 'text', value: 'value' },
        value: 'Male',
        popupHeight: '200px'
    });
    genderDropDown.appendTo('#gender');

    // State DropDownList
    var stateData = [
        'Alabama', 'Alaska', 'California', 'Delaware', 'Florida', 'Georgia',
        'Hawaii', 'Indiana', 'Kentucky', 'Louisiana', 'Maine', 'Maryland', 'New Jersey',
        'New Mexico', 'New York', 'Texas', 'Washington', 'Wyoming'
    ];
    var stateDropDown = new ej.dropdowns.DropDownList({
        dataSource: stateData,
        value: 'Alabama',
        popupHeight: '200px'
    });
    stateDropDown.appendTo('#state');

    // Date of Birth DatePicker
    var dobPicker = new ej.calendars.DatePicker({
        value: new Date(2012, 11, 5),
        format: 'MM/dd/yyyy'
    });
    dobPicker.appendTo('#dob');

    // Newsletter CheckBox
    var newsletterCheckBox = new ej.buttons.CheckBox({
        label: 'Would you like to receive our Newsletter?',
        cssClass: 'e-custom'
    });
    newsletterCheckBox.appendTo('#newsletter');

    function createFormPDF() {
        fetchAsUint8Array(
            'https://cdn.syncfusion.com/content/pdf-resources/form-filling-document.pdf'
        )
            .then(function (pdfBytes) {
                // Read values from HTML form inputs
                var values = getFormValues();
                // Create PDF document instance
                var pdf = new ej.pdf.PdfDocument(pdfBytes);
                var form = pdf.form;
                // Fill Name field
                var nameField = findByName(form, 'name');
                if (nameField) {
                    nameField.text = values.name;
                    nameField.setAppearance(true);
                }
                // Fill Gender (Radio button list)
                var gender = findByName(form, 'gender');
                if (gender) {
                    if (values.gender === 'Male') gender.selectedIndex = 0;
                    else if (values.gender === 'Other') gender.selectedIndex = 1;
                    else if (values.gender === 'Female') gender.selectedIndex = 2;
                    gender.setAppearance(true);
                }
                // Fill Date of Birth
                var dobField = findByName(form, 'dob');
                if (dobField) {
                    dobField.text = values.dob;
                    dobField.setAppearance(true);
                }
                // Fill Email
                var emailField = findByName(form, 'email');
                if (emailField) {
                    emailField.text = values.email;
                    emailField.setAppearance(true);
                }
                // Fill State (ComboBox)
                var stateField = findByName(form, 'state');
                if (stateField) {
                    for (var i = 0; i < stateField.itemsCount; i++) {
                        var item = stateField._options[i];
                        if (item === values.state) {
                            stateField.selectedIndex = i;
                            break;
                        }
                    }
                    stateField.setAppearance(true);
                }
                // Fill Newsletter checkbox
                var newsField = findByName(form, 'newsletter');
                if (newsField) {
                    newsField.checked = values.newsletter;
                    newsField.setAppearance(true);
                }
                // Save filled PDF
                pdf.save('FormFillings.pdf');
                // Cleanup PDF object
                pdf.destroy();
            })
            .catch(function (err) {
                console.error(err);
                alert('Failed to create fillable form PDF');
            })
    };

    // Read values from EJ2 form controls
    function getFormValues() {
        var name = document.querySelector('#name');
        var email = document.querySelector('#email');

        // Get EJ2 component instances
        var genderInstance = ej.base.getComponent(document.querySelector('#gender'), 'dropdownlist');
        var dobInstance = ej.base.getComponent(document.querySelector('#dob'), 'datepicker');
        var stateInstance = ej.base.getComponent(document.querySelector('#state'), 'dropdownlist');
        var newsletterInstance = ej.base.getComponent(document.querySelector('#newsletter'), 'checkbox');

        // Format date to mm/dd/yyyy
        var dob = '';
        if (dobInstance && dobInstance.value) {
            var date = dobInstance.value;
            var month = ('0' + (date.getMonth() + 1)).slice(-2);
            var day = ('0' + date.getDate()).slice(-2);
            var year = date.getFullYear();
            dob = month + '/' + day + '/' + year;
        }

        return {
            name: name ? name.value : '',
            gender: genderInstance ? genderInstance.value : 'Male',
            dob: dob,
            email: email ? email.value : '',
            state: stateInstance ? stateInstance.value : '',
            newsletter: newsletterInstance ? newsletterInstance.checked : false
        };
    }
    // Find PDF form field by name
    function findByName(form, name) {
        for (var i = 0; i < form.count; i++) {
            var field = form.fieldAt(i);
            if (field && field.name === name) return field;
        }
        return undefined;
    }
    //   Fetch URL and return Uint8Array
    function fetchAsUint8Array(url) {
        return fetch(url, { cache: 'no-cache' })
            .then(function (res) {
                if (!res.ok) {
                    throw new Error('Failed to fetch ' + url + ': ' + res.status + ' ' + res.statusText);
                }
                return res.arrayBuffer();
            })
            .then(function (buf) {
                return new Uint8Array(buf);
            });
    }
</script>

<style>
    :root {
        --bg: #f7f7f7;
        --border: #d6d6d6;
        --text: #333;
        --primary: #4a90e2;
        --btn-bg: #e9ecef;
    }
    .control-section {
        border: 2px solid black;
        padding: 10px;
    }
    .form-group {
        margin-bottom: 12px;
    }
    label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
    }
    .e-input,
    .e-dropdownlist,
    .e-datepicker {
        width: 100%;
        height: 30px;
    }
    .e-datepicker{
        height: auto;
    }
    .e-input-group {
        width: 100%;
    }
    input.e-input {
        width: 100%;
        box-sizing: border-box;
    }
    .inline {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
    }
    .btn-row {
        display: flex;
        gap: 12px;
        margin-top: 14px;
        flex-wrap: wrap;
    }
    .btn {
        background: var(--btn-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 14px;
        font-weight: 600;
        cursor: pointer;
    }
    .btn.primary {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
    }
</style>
