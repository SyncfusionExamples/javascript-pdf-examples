<head>
    <!-- Syncfusion JavaScript PDF Library (CDN) -->
    <script src="https://cdn.syncfusion.com/ej2/34.1.29/dist/ej2.min.js"></script>
    <link href="https://cdn.syncfusion.com/ej2/34.1.29/ej2-buttons/styles/material.css" rel="stylesheet">
</head>
<div class="container py-4">
    <h1 class="h4 mb-3">Split PDF</h1>
    <button id="splitBtn" class="btn btn-primary">Generate PDF document</button>
</div>

<script>
    const DEFAULT_PDF_URL = 'https://cdn.syncfusion.com/content/pdf-resources/pdf-succinctly.pdf';
    // Initialize button
    const splitBtn = new ej.buttons.Button({ cssClass: `e-primary`});
    splitBtn.appendTo('#splitBtn');
    // Split PDF on button click
    splitBtn.element.addEventListener('click', async () => {
        try {
            // Load the PDF document from the specified URL.
            const pdfData = await readFromUrl(DEFAULT_PDF_URL);
            const pdf = new ej.pdf.PdfDocument(pdfData);
            // Event triggered each time a split document is generated.
            pdf.splitEvent = (_sender, args) => {
                // Access the PDF document data and load it into PDF document instance.
                const splitDocument = new ej.pdf.PdfDocument(args.pdfData);
                // Save the split PDF document.
                // args.index represents the zero-based index of the split document.
                splitDocument.save(`SplitDocument_${args.index + 1}.pdf`);
                // Release the resources used by the split document.
                splitDocument.destroy();
            };
            // Split the PDF into individual documents.
            pdf.split();
            // Release the resources used by the original PDF document.
            pdf.destroy();
        } catch (error) {
            alert('Failed to split PDF.');
        }
    });

    /**
     * Fetch PDF from URL and return as Uint8Array
     * @param {string} url
     * @returns {Promise<Uint8Array>}
     */
    async function readFromUrl(url) {
        const response = await fetch(url, {
            cache: 'no-cache'
        });
        if (!response.ok) {
            throw new Error(
                `Failed to fetch ${url}: ${response.status} ${response.statusText}`
            );
        }
        const buffer = await response.arrayBuffer();
        return new Uint8Array(buffer);
    }
</script>
