<head>
    <!-- Syncfusion JavaScript PDF Library (CDN) -->
    <script src="https://cdn.syncfusion.com/ej2/33.2.12/dist/ej2.min.js"></script>
</head>
<div class="container py-4">
    <h1 class="h4 mb-3">Split PDF</h1>
    <label>Pages per file:</label>
    <input type="number" id="pagesPerFileInput" value="2" min="1" />
    <button id="splitBtn" class="btn btn-primary">Generate PDF document</button>
</div>

<script>
    var DEFAULT_PDF_URL = 'https://cdn.syncfusion.com/content/pdf-resources/pdf-succinctly.pdf';
    var splitBtn = new ej.buttons.Button();
    splitBtn.appendTo('#splitBtn');
    // Click handler to merge PDFs
    splitBtn.element.onclick = function () {
        fetch(DEFAULT_PDF_URL)
            .then(function (response) {
                return response.arrayBuffer();
            })
            .then(function (buffer) {
                var pdf = new ej.pdf.PdfDocument(
                    new Uint8Array(buffer)
                );
                // Downloads each split document
                pdf.splitEvent = function (_sender, args) {
                    var splitDoc = new ej.pdf.PdfDocument(args.pdfData);
                    splitDoc.save(
                        'SplitDocument_' + (args.index + 1) + '.pdf'
                    );
                    splitDoc.destroy();
                };
                var pagesPerFile =
                    parseInt(
                        document.getElementById('pagesPerFileInput').value,
                        10
                    ) || 1;
                pdf.splitByFixedNumber(pagesPerFile);
                pdf.destroy();
            })
            .catch(function (error) {
                console.error(error);
                alert('Failed to split PDF.');
            });
    };
</script>
