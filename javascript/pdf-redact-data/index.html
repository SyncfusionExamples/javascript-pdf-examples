<head>
    <!-- Syncfusion JavaScript PDF Library (CDN) -->
    <script src="https://cdn.syncfusion.com/ej2/34.1.29/dist/ej2.min.js"></script>
    <link href="https://cdn.syncfusion.com/ej2/34.1.29/ej2-buttons/styles/material.css" rel="stylesheet">
</head>
<div class="container py-4">
    <h1 class="h4 mb-3">Redact Data in PDF document</h1>
    <button id="redactbtn" class="btn btn-primary">Redact PDF</button>
</div>

<script>
    var redactbtn = new ej.buttons.Button({ cssClass: 'e-primary' }, '#redactbtn');
    redactbtn.element.onclick = redactPdf;
	// Redact predefined regions from resource PDF
    function redactPdf() {
        readFromUrl(input)
            .then(function (pdfData) {
				var data = pdfData instanceof Uint8Array ? pdfData : new Uint8Array(pdfData);
				// Load PDF data
                var pdf = new ej.pdf.PdfDocument(data);
				// Rectangle bounds to apply redaction
				var rects = [{ x: 70, y: 120, width: 200, height: 80 }, { x: 400, y: 150, width: 100, height: 30 }];
				// Create PDF redactor instance
				var redactor = new ej.pdfdataextract.PdfRedactor(pdf);
				// Define redaction regions to apply redaction on PDF pages
				var regions = rects.map(function (r) {
					var region = new ej.pdfdataextract.PdfRedactionRegion(0, {
						x: r.x,
						y: r.y,
						width: r.width,
						height: r.height
					});
					region.fillColor = { r: 0, g: 0, b: 0 };
					return region;
				});
				// Add redaction regions to the collection
				redactor.add(regions);
				// Apply redaction
				redactor.redactSync();
				// Save redacted PDF document
				pdf.save('Redaction.pdf');
				pdf.destroy();
            })
            .catch(function (err) {
                console.error(err);
                alert('Failed to redact the resource PDF.');
            });
    }
	// Template PDF URL
    var input = 'https://cdn.syncfusion.com/content/pdf-resources/credit_card_statement.pdf';
    // Fetch helper
    function readFromUrl(url) {
        return fetch(url, { cache: 'no-cache' })
            .then(function (res) {
                if (!res.ok) {
                    throw new Error('Failed to fetch ' + url + ': ' + res.status + ' ' + res.statusText);
                }
                return res.arrayBuffer();
            })
            .then(function (buf) {
                return new Uint8Array(buf);
            });
    }
</script>
